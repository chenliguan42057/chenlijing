name = "fatloss-ai"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 绑定 Cloudflare Workers AI（平台自带，不需要任何 API Key）
[ai]
binding = "AI"

# 可选安全加固：只允许你的 GitHub Pages 来源访问。
# 在 Cloudflare 后台「Settings → Variables」里添加环境变量 ALLOWED_ORIGIN，
# 值填你的 Pages 地址，例如：https://username.github.io
# 不设置则默认允许所有来源（*）。
# [vars]
# ALLOWED_ORIGIN = "https://username.github.io"
